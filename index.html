<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KosaKata">
<meta name="description" content="Kamus & latihan kosakata Bahasa Inggris - Indonesia">
<title>KosaKata — Kamus Inggris ⇄ Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Terapkan tema secepat mungkin agar tidak "berkedip"
  try {
    var s = JSON.parse(localStorage.getItem('kosakata.settings') || '{}');
    var t = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
:root{
  --fs:1;
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4; --text:#0E1A24; --muted:#5B6B78; --line:#E1E7EB;
  --primary:#0F766E; --primary-ink:#FFFFFF; --primary-soft:#DCF3EF; --accent:#F59E0B; --accent-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FDE8E8; --ok:#15803D; --ok-soft:#DCFCE7;
  --shadow:0 1px 2px rgba(14,26,36,.05),0 6px 18px rgba(14,26,36,.05);
  --radius:16px; --nav-h:64px; --bar-h:58px;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI",Roboto,system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0B1117; --surface:#131B23; --surface-2:#1B252F; --text:#E7EDF1; --muted:#8C9DAA; --line:#232F3A;
  --primary:#2DD4BF; --primary-ink:#042420; --primary-soft:#11312D; --accent:#FBBF24; --accent-soft:#3A2E10;
  --danger:#F87171; --danger-soft:#3A1717; --ok:#4ADE80; --ok-soft:#123020;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(16px * var(--fs));line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;transition:background .25s,color .25s}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
a{color:inherit;text-decoration:none}
svg{flex:none}
[hidden]{display:none!important}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.bar-inner{max-width:560px;margin:0 auto;height:var(--bar-h);display:flex;align-items:center;gap:6px;padding:0 10px 0 14px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em;position:relative;flex:none}
.logo:after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-1px}
.acc-pill{height:36px;padding:0 12px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.acc-pill .lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .1s}
.icon-btn:active{background:var(--surface-2);transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}
#btn-back{color:var(--text);margin-left:-8px}

/* ---------- Layout ---------- */
main{max-width:560px;margin:0 auto;padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.center{text-align:center}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:22px 2px 10px;letter-spacing:-.01em}
.sec-title small{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:999px}
.hero{padding:8px 2px 4px}
.hero h1{font-size:calc(24px * var(--fs));line-height:1.2;font-weight:800;letter-spacing:-.03em;margin-top:4px}

/* ---------- Search ---------- */
.search{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top));z-index:20;padding:10px 0 12px;background:var(--bg)}
.search-field,.filter-field{display:flex;align-items:center;gap:10px;height:54px;padding:0 6px 0 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);transition:border-color .15s}
.search-field:focus-within,.filter-field:focus-within{border-color:var(--primary)}
.search-field>svg,.filter-field>svg{width:20px;height:20px;color:var(--muted)}
.search-field input,.filter-field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.search-field input::-webkit-search-cancel-button,.filter-field input::-webkit-search-cancel-button{display:none}
.filter-field{height:48px;margin-bottom:4px;box-shadow:none}
.res-meta{font-size:13px;color:var(--muted);margin:0 2px 10px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.wod{padding:18px;position:relative;overflow:hidden;margin-top:6px;background:linear-gradient(135deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 70%,#0B3B66) 100%);color:#fff;border:0}
[data-theme=dark] .wod{color:var(--primary-ink)}
.wod:before{content:"Aa";position:absolute;right:-6px;bottom:-34px;font-size:120px;font-weight:800;opacity:.09;letter-spacing:-.06em}
.wod .eyebrow{color:inherit;opacity:.85}
.wod-en{font-size:calc(30px * var(--fs));font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.wod-ipa{font-family:var(--ipa);opacity:.9;margin-top:4px}
.wod-ar{font-size:calc(17px * var(--fs));font-weight:600;margin-top:8px}
.wod-ex{font-size:calc(14px * var(--fs));opacity:.85;margin-top:6px;font-style:italic}
.wod-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wod-actions .chip-btn{white-space:nowrap}
.wod .chip-btn{background:rgba(255,255,255,.18);color:inherit}
[data-theme=dark] .wod .chip-btn{background:rgba(0,0,0,.14)}
.chip-btn{height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:var(--surface-2)}
.chip-btn svg{width:18px;height:18px}
.chip-btn.on svg{fill:currentColor}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:12px 12px 10px;text-align:left}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group-tile{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:112px;background:var(--surface);background:color-mix(in srgb,var(--gc) 9%,var(--surface));border-color:color-mix(in srgb,var(--gc) 20%,var(--line));transition:transform .1s}
.group-tile:active{transform:scale(.98)}
.group-tile .gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--surface);background:color-mix(in srgb,var(--gc) 18%,var(--surface))}
.group-tile b{font-size:14.5px;line-height:1.25;font-weight:700}
.group-tile small{font-size:12px;color:var(--muted);font-weight:600;margin-top:auto}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{padding:14px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;font-size:14px}
.quick-btn .qi{font-size:22px}
.quick-btn small{display:block;font-weight:500;color:var(--muted);font-size:12px}

.install{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;margin-top:12px;border-style:dashed}
.install p{flex:1;font-size:13.5px}
.install p b{display:block;font-size:14px}

/* ---------- Chips ---------- */
.chips-wrap{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top));z-index:15;background:var(--bg);padding:6px 0 10px;margin:0 -16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- Category list ---------- */
.cat-list{display:flex;flex-direction:column;gap:8px}
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:64px;transition:transform .1s}
.cat-row:active{transform:scale(.985);background:var(--surface-2)}
.cat-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--surface-2);background:color-mix(in srgb,var(--gc) 14%,var(--surface));position:relative}
.cat-no{position:absolute;bottom:-5px;right:-6px;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:10px;font-weight:800;display:grid;place-items:center;color:var(--muted)}
.cat-txt{flex:1;min-width:0}
.cat-txt b{display:block;font-size:calc(15px * var(--fs));font-weight:700;line-height:1.25}
.cat-txt small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.cat-row>svg{width:18px;height:18px;color:var(--muted)}

/* ---------- Category detail ---------- */
.cat-head{display:flex;gap:14px;align-items:center;padding:10px 2px 4px}
.cat-big{width:64px;height:64px;border-radius:18px;font-size:32px;display:grid;place-items:center;flex:none;background:var(--surface-2);background:color-mix(in srgb,var(--gc) 16%,var(--surface))}
.cat-head h1{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.cat-head p.muted{font-size:13.5px;margin-top:2px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.list-tools{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;font-size:13px;color:var(--muted)}
.text-btn{font-size:13px;font-weight:700;color:var(--primary);padding:8px 4px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pager a{padding:12px;font-size:13px;color:var(--muted);display:block}
.pager a b{display:block;color:var(--text);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager a.next{text-align:right}

/* ---------- Buttons ---------- */
.btn{height:50px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;transition:transform .1s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.bad{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.lg{height:56px;font-size:16px}

/* ---------- Word card ---------- */
.word-list{display:flex;flex-direction:column;gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.word-main{display:flex;gap:6px;padding:14px 8px 14px 16px;align-items:flex-start}
.has-ex .word-main{cursor:pointer}
.word-text{flex:1;min-width:0}
.w-en{font-size:calc(18px * var(--fs));font-weight:700;letter-spacing:-.01em;line-height:1.3;word-break:break-word}
.w-ipa{font-family:var(--ipa);color:var(--primary);font-size:calc(15px * var(--fs));margin-top:2px;word-break:break-word}
.w-ar{margin-top:5px;font-size:calc(15px * var(--fs));color:var(--text);opacity:.86}
.w-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.w-cat,.w-more{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:4px 9px;border-radius:999px}
.w-more svg{width:14px;height:14px;transition:transform .2s}
.word.open .w-more svg{transform:rotate(180deg)}
.word-btns{display:flex;gap:2px}
.speak{color:var(--primary)}
.speak.playing{background:var(--primary-soft);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92)}}
.star.on{color:var(--accent)}
.star.on svg{fill:var(--accent)}
.word-ex{display:none;margin:0 16px;padding:12px 0 14px;border-top:1px dashed var(--line)}
.word.open .word-ex{display:block;animation:fade .2s}
.word-ex p.ex-id{font-style:normal;color:var(--muted);margin-top:4px;opacity:1}
.word-ex p{font-size:calc(14.5px * var(--fs));font-style:italic;color:var(--text);opacity:.9}
.mini-btn{margin-top:8px;height:34px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--primary-soft);color:var(--primary)}
.mini-btn svg{width:16px;height:16px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:48px 24px 24px}
.empty .ei{font-size:46px}
.empty b{display:block;font-size:17px;margin-top:10px}
.empty p{font-size:14px;color:var(--muted);margin:6px auto 18px;max-width:290px}

/* ---------- Practice setup ---------- */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);transition:border-color .15s,background .15s}
.mode-card.on{border-color:var(--primary);background:var(--primary-soft)}
.mode-card .mi{font-size:28px;margin-bottom:4px}
.mode-card b{font-size:16px}
.mode-card small{font-size:12.5px;color:var(--muted);line-height:1.35}
.select-wrap{position:relative}
.select-wrap select{appearance:none;-webkit-appearance:none;width:100%;height:54px;padding:0 44px 0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;outline:0}
.select-wrap select:focus{border-color:var(--primary)}
.select-wrap svg{position:absolute;right:14px;top:17px;width:20px;height:20px;pointer-events:none;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{height:42px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:15px}
.switch-row input{position:absolute;opacity:0;pointer-events:none}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch-row input:checked+.switch{background:var(--primary)}
.switch-row input:checked+.switch:after{transform:translateX(20px)}
.start-wrap{margin-top:24px}

/* ---------- Session ---------- */
.sess-top{display:flex;align-items:center;gap:12px;padding:10px 2px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.progress{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.score-pill{background:var(--ok-soft);color:var(--ok);padding:3px 10px;border-radius:999px}

.flip{perspective:1200px;height:340px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--primary);color:var(--primary-ink);border:0}
.face-tag{position:absolute;top:16px;left:16px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:999px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face.back .face-tag{background:rgba(255,255,255,.18);color:inherit}
.face-hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.face.back .face-hint{color:inherit;opacity:.75}
.fc-en{font-size:calc(34px * var(--fs));font-weight:800;letter-spacing:-.03em;line-height:1.15;word-break:break-word}
.fc-ipa{font-family:var(--ipa);font-size:calc(18px * var(--fs));color:var(--primary);margin-top:6px}
.fc-ar{font-size:calc(26px * var(--fs));font-weight:800;letter-spacing:-.02em;line-height:1.25}
.fc-ex{font-size:calc(15px * var(--fs));font-style:italic;opacity:.88;margin-top:14px;max-width:420px}
.round-btn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-top:16px}
.round-btn svg{width:24px;height:24px}
.round-btn.playing{animation:pulse 1s infinite}
.fc-nav{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin-top:16px}
.fc-nav .btn{padding:0}
.fc-judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.q-card{padding:28px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;position:relative;min-height:190px;justify-content:center}
.q-card .face-tag{position:static;margin-bottom:12px}
.q-prompt{font-size:calc(30px * var(--fs));font-weight:800;letter-spacing:-.02em;line-height:1.2;word-break:break-word}
.q-prompt.idn{font-size:calc(24px * var(--fs))}
.q-card .round-btn{width:46px;height:46px;margin-top:12px}
.options{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:calc(15.5px * var(--fs));font-weight:600;transition:transform .1s,border-color .15s,background .15s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt-l{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-size:13px;font-weight:800;color:var(--muted);flex:none}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .opt-l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .opt-l{background:var(--danger);color:#fff}
.opt:disabled{opacity:1}
.feedback{margin-top:14px;padding:14px 16px;border-radius:14px;animation:fade .2s}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--danger-soft);color:var(--danger)}
.feedback b{display:block;font-size:16px}
.feedback span{font-size:14px;color:var(--text)}
.next-wrap{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);margin-top:14px}

.result{text-align:center;padding:16px 4px 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-2) 0)}
.ring div{width:122px;height:122px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:-.03em}
.ring small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:-6px}
.result h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.result p{color:var(--muted);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}

/* ---------- Bottom nav ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .inner{max-width:560px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.nav-item .pill{width:58px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s,color .2s;position:relative}
.nav-item svg{width:23px;height:23px}
.nav-item.active{color:var(--text)}
.nav-item.active .pill{background:var(--primary-soft);color:var(--primary)}
.badge{position:absolute;top:0;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#1F1300;font-size:10.5px;font-weight:800;display:grid;place-items:center}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:all .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Progres hafalan ---------- */
.pbar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ok);transition:width .4s ease}
.pbar.sm{height:5px;border-radius:3px}
.prog-card{padding:16px;margin-top:6px}
.prog-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prog-top b{font-size:14px;font-weight:800}
.prog-pct{font-size:12.5px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:3px 10px;border-radius:999px}
.prog-num{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.prog-num small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
.prog-card .pbar{margin:10px 0 12px;height:10px;border-radius:5px}
.prog-mini{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);font-weight:600}
.prog-mini a{color:var(--primary)}
.continue{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;margin:6px 0 2px;background:var(--primary-soft);border-radius:16px;transition:transform .1s}
.continue:active{transform:scale(.985)}
.continue .ci{width:48px;height:48px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:25px;flex:none}
.continue .ct{flex:1;min-width:0}
.continue .ct small{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--primary)}
.continue .ct b{display:block;font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.continue .ct>span{display:block;font-size:12.5px;color:var(--muted);margin:1px 0 6px}
.continue .go{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.continue .go svg{width:20px;height:20px}
.group-tile .pbar{margin-top:6px}
.group-tile small{margin-top:auto}
.cat-prog{display:block;margin-top:7px;max-width:180px}
.cat-count{text-align:right;line-height:1.25}
.cat-count b{display:block;color:var(--text);font-size:13px}
.cat-row.done .cat-count{color:var(--ok)}
.cat-row.done .cat-ic{box-shadow:0 0 0 2px var(--ok)}
.cat-head-prog{padding:14px 16px;margin-top:12px}
.cat-head-prog .prog-num{font-size:22px}
.cat-head-prog .pbar{margin:8px 0 2px}
.status-seg{margin-top:12px}
.status-seg button{font-size:13px;padding:0 4px}
.seg button small{font-weight:700;opacity:.65;margin-left:4px;font-size:11.5px}

/* kartu kata: status hafal */
.word.known{border-color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.w-known{display:none;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:4px 9px;border-radius:999px}
.word.known .w-known{display:inline-flex}
.w-known svg{width:13px;height:13px;stroke-width:3}
.word:not(.known) .w-meta.only-badge{display:none}
.word-btns .icon-btn{width:40px}
.check.on{color:var(--ok)}
.check.on svg circle{fill:var(--ok);stroke:var(--ok)}
.check.on svg polyline{stroke:#fff}
[data-theme=dark] .check.on svg polyline{stroke:#062012}
.chip-btn.check.on{background:var(--ok-soft);color:var(--ok)}
.wod .chip-btn.check.on{background:rgba(255,255,255,.92);color:#15803D}
.wod .chip-btn.check.on svg polyline{stroke:#fff}
.word.leaving{animation:leave .25s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(28px)}}
.face-tag.ok{left:auto;right:16px;background:var(--ok-soft);color:var(--ok)}

/* ---------- Pengaturan ---------- */
.set-card{overflow:hidden}
.set-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;border-top:1px solid var(--line);text-align:left;cursor:pointer;background:none}
.set-row:first-child{border-top:0}
.set-row:active{background:var(--surface-2)}
.set-row .si{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.set-row .st{flex:1;min-width:0}
.set-row .st b{display:block;font-size:15px;font-weight:700}
.set-row .st small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.set-row>svg{width:18px;height:18px;color:var(--muted)}
.set-row.danger .st b{color:var(--danger)}
.set-row.danger .si{background:var(--danger-soft)}
.set-row .seg{flex:none}
.set-row.wrap{flex-wrap:wrap}
.set-row.wrap .seg{flex:1 1 100%;margin:2px 0 4px 50px}
.list-tools span{padding-right:10px}
.set-row .seg button{height:36px;padding:0 10px;font-size:13px}
.set-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.set-row input:checked+.switch{background:var(--primary)}
.set-row input:checked+.switch:after{transform:translateX(20px)}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
textarea.code{display:block;width:100%;min-height:120px;margin:10px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--text);resize:vertical;outline:0}
textarea.code:focus{border-color:var(--primary)}
.import-preview{padding:16px;margin-top:12px;border:2px solid var(--primary)}
.import-preview b{display:block;font-size:16px}
.import-preview ul{margin:8px 0 14px 18px;font-size:14px}
.import-preview .btn-row{margin:0 0 8px}
.note{display:flex;gap:10px;padding:12px 14px;margin-top:10px;border-radius:14px;background:var(--surface-2);font-size:13px;line-height:1.45}


/* ---------- Hari ini: target, streak, ulangan ---------- */
.today-card{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:10px}
.ring-sm{width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--surface-2) 0)}
.ring-sm.met{background:var(--ok)}
.ring-sm>div{width:60px;height:60px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-sm b{font-size:21px;font-weight:800}
.ring-sm small{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.today-info{flex:1;min-width:0}
.today-info>b{display:block;font-size:15px;font-weight:800}
.today-info>span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.streak-chip{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:#B45309;font-weight:800;font-size:12.5px}
[data-theme=dark] .streak-chip{color:var(--accent)}
.review-card{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px 13px 14px;text-align:left;margin-top:10px;transition:transform .1s}
.review-card:active{transform:scale(.985)}
.review-card .ri{width:44px;height:44px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;flex:none}
.review-card .rt{flex:1;min-width:0}
.review-card .rt b{display:block;font-size:15px;font-weight:800}
.review-card .rt span{display:block;font-size:12.5px;color:var(--muted)}
.review-card .go{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.review-card .go svg{width:20px;height:20px}
.review-card.has-due{border-color:var(--accent);background:var(--accent-soft);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.review-card.has-due .ri{background:var(--accent-soft)}
.review-card.has-due .go{background:var(--accent);color:#1F1300}
.link-row{display:flex;justify-content:flex-end;margin-top:6px}

/* ---------- Pencarian suara ---------- */
.mic-btn{color:var(--primary)}
.mic-btn.listening{color:#fff;background:var(--danger);animation:pulse 1s infinite}
.voice-bar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:-4px 2px 10px}
.voice-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}

/* ---------- Tab Favorit / Kata Sulit ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);margin:6px 0 12px}
.tabs a{height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs a small{font-size:11.5px;opacity:.75}
.tabs a.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.w-hard{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:var(--danger);background:var(--danger-soft);padding:4px 9px;border-radius:999px}
.w-known.due{color:#B45309;background:var(--accent-soft)}
[data-theme=dark] .w-known.due{color:var(--accent)}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
.btn-row.three .btn{padding:0 6px;font-size:14px}
.grp-practice{margin:0 0 4px}.grp-hint{margin:0 2px 12px}

/* ---------- Mode latihan ---------- */
.mode-card.disabled{opacity:.45}
.mode-card .badge-new{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--danger);padding:2px 6px;border-radius:6px;margin-bottom:2px}
.big-play{width:108px;height:108px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin:8px auto 0;box-shadow:0 10px 28px rgba(15,118,110,.28)}
.big-play svg{width:46px;height:46px}
.big-play.playing{animation:pulse 1s infinite}
.listen-tools{display:flex;justify-content:center;gap:8px;margin-top:14px}
.spell-pattern{font:700 calc(20px * var(--fs))/1.6 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;margin-top:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;text-align:center}
.spell-input{display:block;width:100%;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 16px;font-size:calc(20px * var(--fs));font-weight:700;outline:0;margin-top:14px;text-align:center}
.spell-input:focus{border-color:var(--primary)}
.spell-input.good{border-color:var(--ok);background:var(--ok-soft)}
.spell-input.bad{border-color:var(--danger);background:var(--danger-soft)}
.tool-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tool-row.two{grid-template-columns:1fr 1fr}
.tool-row .btn{height:46px;font-size:14px;padding:0 8px}
.mic-big{width:108px;height:108px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;margin:18px auto 0;box-shadow:0 10px 28px rgba(220,38,38,.28)}
.mic-big svg{width:44px;height:44px}
.mic-big.listening{animation:pulse 1s infinite}
.heard{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;text-align:center}
.heard.good{background:var(--ok-soft);color:var(--ok)}
.heard.bad{background:var(--danger-soft);color:var(--danger)}
.heard b{color:var(--text)}

/* ---------- Statistik ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid .card{padding:14px}
.stat-grid b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat-grid span{font-size:12.5px;color:var(--muted);font-weight:600}
.chart-card{padding:16px 12px 12px}
.bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;padding-top:24px;align-items:end}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-val{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
.bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--primary-soft);min-height:3px}
.bar.met{background:var(--ok)}
.bar.today{box-shadow:0 0 0 2px var(--primary)}
.bar-lbls{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
.bar-lbls span{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);pointer-events:none}
.goal-line span{position:absolute;right:0;top:-19px;font-size:10.5px;font-weight:800;color:#B45309;background:var(--surface);padding:0 4px;border-radius:4px}
.lvl-row{display:grid;grid-template-columns:108px 1fr 36px;gap:10px;align-items:center;font-size:13px;font-weight:600;margin:9px 0}
.lvl-row b{text-align:right;font-size:13px}

@media (max-width:380px){ .acc-pill .lbl{display:none} .acc-pill{padding:0 10px} }
@media (min-width:600px){ .hero h1{font-size:28px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

     - Kolom ke-4: contoh kalimat Inggris, lalu tanda " | ", lalu terjemahannya.

     - Kolom ke-4 (contoh) & ke-5 (teks audio) boleh dihapus/dikosongkan.

{ no: 3, id: "how-to-say-phonetic", g: "dasar", name: "Cara Baca Simbol Bunyi", en: "How to Say Phonetic Symbol", icon: "🔊", items: [
  ["schwa","/ʃwɑː/","Nama simbol ə","The symbol ə is called schwa. | Simbol ə disebut schwa."],

  ["ash","/æʃ/","Nama simbol æ","Ash is the vowel in 'cat'. | Ash adalah bunyi vokal pada 'cat'."],
  ["wedge","/wɛdʒ/","Nama simbol ʌ (disebut juga turned v)","The wedge is the vowel in 'cup'. | Wedge adalah bunyi vokal pada 'cup'."],

  ["small capital I","/smɔːl ˈkæpɪtəl aɪ/","Nama simbol ɪ","Small capital I is the vowel in 'sit'. | Small capital I adalah bunyi vokal pada 'sit'."],

  ["reversed epsilon","/rɪˈvɜːrst ˈɛpsɪlɑːn/","Nama simbol ɜ","Reversed epsilon is the vowel in 'bird'. | Reversed epsilon adalah bunyi vokal pada 'bird'."],
  ["turned r","/tɜːrnd ɑːr/","Nama simbol ɹ (bunyi r Inggris)","Turned r shows the English r sound. | Turned r menunjukkan bunyi r bahasa Inggris."],

  ["borrow vs lend","/ˈbɑːroʊ/ · /lɛnd/","borrow = meminjam (dari orang); lend = meminjamkan (ke orang)","Can I borrow your pen? — Sure, I'll lend it to you. | Boleh saya pinjam pulpenmu? — Tentu, saya pinjamkan.","borrow, lend"],
  ["say vs tell","/seɪ/ · /tɛl/","say = mengatakan sesuatu; tell = memberi tahu seseorang","She said hello. She told me the news. | Dia mengucapkan halo. Dia memberi tahu saya kabar itu.","say, tell"],
  ["speak vs talk","/spiːk/ · /tɔːk/","speak = berbicara (lebih formal/bahasa); talk = mengobrol","Do you speak English? We talked all night. | Kamu bisa berbahasa Inggris? Kami mengobrol semalaman.","speak, talk"],
  ["see, look, watch","/siː/ · /lʊk/ · /wɑːtʃ/","see = melihat (tak sengaja); look = memandang; watch = menonton/mengamati","Look at the board. We watch TV at night. | Lihat ke papan tulis. Kami menonton TV di malam hari.","see, look, watch"],
  ["hear vs listen","/hɪr/ · /ˈlɪsən/","hear = mendengar (tak sengaja); listen = mendengarkan (sengaja)","I heard a noise. Listen to the music. | Saya mendengar suara berisik. Dengarkan musiknya.","hear, listen"],
  ["make vs do","/meɪk/ · /duː/","make = membuat (menghasilkan); do = melakukan (tugas/aktivitas)","Make a cake. Do your homework. | Buat kue. Kerjakan PR-mu.","make, do"],
  ["bring vs take","/brɪŋ/ · /teɪk/","bring = membawa ke sini; take = membawa ke sana","Bring me water. Take this to your mom. | Bawakan saya air. Bawa ini ke ibumu.","bring, take"],
  ["learn vs study","/lɜːrn/ · /ˈstʌdi/","learn = mendapat ilmu/keterampilan; study = belajar (menekuni)","I study every night to learn English. | Saya belajar setiap malam agar menguasai bahasa Inggris.","learn, study"],
  ["wear vs use","/wɛr/ · /juːz/","wear = memakai (pakaian/aksesori); use = menggunakan (alat)","Wear a helmet. Use a pen. | Pakai helm. Gunakan pulpen.","wear, use"],
  ["rise vs raise","/raɪz/ · /reɪz/","rise = naik (sendiri); raise = menaikkan (sesuatu)","The sun rises. Raise your hand. | Matahari terbit. Angkat tanganmu.","rise, raise"],
  ["lie vs lay","/laɪ/ · /leɪ/","lie = berbaring; lay = meletakkan","I lie on the bed. Lay the book on the table. | Saya berbaring di kasur. Letakkan bukunya di meja.","lie, lay"],
  ["few vs little","/fjuː/ · /ˈlɪtəl/","few = sedikit (bisa dihitung); little = sedikit (tak bisa dihitung)","a few books, a little water | sedikit buku, sedikit air","few, little"],
  ["many vs much","/ˈmɛni/ · /mʌtʃ/","many = banyak (bisa dihitung); much = banyak (tak bisa dihitung)","many friends, much money | banyak teman, banyak uang","many, much"],
  ["among vs between","/əˈmʌŋ/ · /bɪˈtwiːn/","between = di antara dua; among = di antara banyak","between Ani and Budi; among my friends | di antara Ani dan Budi; di antara teman-teman saya","among, between"],
  ["since vs for","/sɪns/ · /fɔːr/","since = sejak (titik waktu); for = selama (durasi)","since 2020; for five years | sejak 2020; selama lima tahun","since, for"],
  ["ago vs before","/əˈɡoʊ/ · /bɪˈfɔːr/","ago = yang lalu (dari sekarang); before = sebelum(nya)","two days ago; before lunch | dua hari yang lalu; sebelum makan siang","ago, before"],
  ["already vs yet","/ɔːlˈrɛdi/ · /jɛt/","already = sudah (positif); yet = belum (negatif) / sudah? (tanya)","I've already eaten. I haven't eaten yet. | Saya sudah makan. Saya belum makan.","already, yet"],
  ["fun vs funny","/fʌn/ · /ˈfʌni/","fun = menyenangkan; funny = lucu","The party was fun. The joke was funny. | Pestanya menyenangkan. Leluconnya lucu.","fun, funny"],
  ["boring vs bored","/ˈbɔːrɪŋ/ · /bɔːrd/","boring = membosankan (sifat hal); bored = merasa bosan","The film is boring, so I'm bored. | Filmnya membosankan, jadi saya bosan.","boring, bored"],
  ["home vs house","/hoʊm/ · /haʊs/","house = bangunan rumah; home = tempat tinggal (rasa rumah)","They bought a house. There's no place like home. | Mereka membeli sebuah rumah. Tidak ada tempat seperti rumah sendiri.","home, house"],
  ["job vs work","/dʒɑːb/ · /wɜːrk/","job = pekerjaan (posisi, bisa dihitung); work = kerja (tak bisa dihitung)","I have a new job. I have a lot of work. | Saya punya pekerjaan baru. Kerjaan saya banyak.","job, work"],
  ["lose vs loose","/luːz/ · /luːs/","lose = kehilangan, kalah; loose = longgar","Don't lose your keys. My shirt is loose. | Jangan sampai kuncimu hilang. Kemeja saya longgar.","lose, loose"],
  ["quite vs quiet","/kwaɪt/ · /ˈkwaɪət/","quite = cukup, agak; quiet = sepi, tenang","It's quite cold. Be quiet! | Cuacanya cukup dingin. Diam!","quite, quiet"],
  ["affect vs effect","/əˈfɛkt/ · /ɪˈfɛkt/","affect = memengaruhi (kerja); effect = dampak (benda)","Stress affects sleep. It has a bad effect. | Stres memengaruhi tidur. Itu berdampak buruk.","affect, effect"],
  ["advice vs advise","/ədˈvaɪs/ · /ədˈvaɪz/","advice = nasihat (benda); advise = menasihati (kerja)","Thanks for the advice. I advise you to rest. | Terima kasih atas nasihatnya. Saya sarankan kamu beristirahat.","advice, advise"],
  ["then vs than","/ðɛn/ · /ðæn/","then = lalu, kemudian; than = daripada","Eat, then sleep. She is taller than me. | Makan, lalu tidur. Dia lebih tinggi daripada saya.","then, than"],
  ["its vs it's","/ɪts/","its = miliknya; it's = it is / it has","The cat licks its paw. It's raining. | Kucing itu menjilati kakinya. Sedang hujan.","its, it's"],
  ["your vs you're","/jʊr/","your = milikmu; you're = you are","Your bag is here. You're late. | Tasmu ada di sini. Kamu terlambat.","your, you're"],
  ["their, there, they're","/ðɛr/","their = milik mereka; there = di sana; they're = they are","They're at their house over there. | Mereka ada di rumah mereka di sebelah sana.","their, there, they're"],
  ["especially vs specially","/ɪˈspɛʃəli/ · /ˈspɛʃəli/","especially = terutama; specially = khusus (untuk)","I like fruit, especially mango. This is specially for you. | Saya suka buah, terutama mangga. Ini khusus untukmu.","especially, specially"],
  ["sometimes vs sometime","/ˈsʌmtaɪmz/ · /ˈsʌmtaɪm/","sometimes = kadang-kadang; sometime = suatu saat","I sometimes cook. Let's meet sometime. | Saya kadang-kadang memasak. Ayo bertemu suatu saat nanti.","sometimes, sometime"]
]},
{ no: 70, id: "daily-expressions", g: "ekspresi", name: "Ungkapan Sehari-hari", en: "Daily Expressions", icon: "💬", items: [
  ["Good morning!","/ɡʊd ˈmɔːrnɪŋ/","Selamat pagi!","Good morning, everyone! | Selamat pagi, semuanya!"],
  ["Good afternoon!","/ɡʊd ˌæftərˈnuːn/","Selamat siang/sore!","Good afternoon, sir. | Selamat siang, Pak."],
  ["Good evening!","/ɡʊd ˈiːvnɪŋ/","Selamat malam! (saat bertemu)","Good evening, ladies and gentlemen. | Selamat malam, Bapak-bapak dan Ibu-ibu."],
  ["Good night!","/ɡʊd naɪt/","Selamat tidur / selamat malam (saat berpisah)","Good night, sleep well. | Selamat malam, tidur yang nyenyak."],
  ["Hello! / Hi!","/həˈloʊ/ · /haɪ/","Halo! / Hai!","Hi, I'm Budi. | Hai, saya Budi.","hello, hi"],
  ["How are you?","/haʊ ɑːr juː/","Apa kabar?","Hi Dina, how are you? | Hai Dina, apa kabar?"],
  ["How's it going?","/haʊz ɪt ˈɡoʊɪŋ/","Gimana kabarnya? (santai)","Hey, how's it going? | Hei, gimana kabarnya?"],
  ["What's up?","/wʌts ʌp/","Ada apa? / Apa kabar? (santai)","Hey bro, what's up? | Hei bro, ada apa?"],
  ["I'm fine, thank you.","/aɪm faɪn ˈθæŋk juː/","Saya baik, terima kasih.","I'm fine, thank you. And you? | Saya baik, terima kasih. Kamu bagaimana?"],
  ["Long time no see!","/lɔːŋ taɪm noʊ siː/","Lama tidak bertemu!","Long time no see! How have you been? | Lama tak jumpa! Apa kabar selama ini?"],
  ["Nice to meet you.","/naɪs tuː miːt juː/","Senang bertemu denganmu.","Nice to meet you, Mr. Hadi. | Senang bertemu dengan Anda, Pak Hadi."],
  ["What's your name?","/wʌts jʊr neɪm/","Siapa namamu?","Hi! What's your name? | Hai! Siapa namamu?"],
  ["Where are you from?","/wɛr ɑːr juː frʌm/","Kamu berasal dari mana?","Where are you from? — I'm from Semarang. | Kamu dari mana? — Saya dari Semarang."],
  ["Welcome!","/ˈwɛlkəm/","Selamat datang!","Welcome to our home! | Selamat datang di rumah kami!"],
  ["Please.","/pliːz/","Tolong. / Silakan.","Please sit down. | Silakan duduk."],
  ["Thank you very much.","/ˈθæŋk juː ˈvɛri mʌtʃ/","Terima kasih banyak.","Thank you very much for your help. | Terima kasih banyak atas bantuannya."],
  ["Thanks a lot.","/θæŋks ə lɑːt/","Makasih banyak.","Thanks a lot, bro! | Makasih banyak, bro!"],
  ["You're welcome.","/jʊr ˈwɛlkəm/","Sama-sama.","— Thanks! — You're welcome. | — Makasih! — Sama-sama."],
  ["No problem.","/noʊ ˈprɑːbləm/","Tidak masalah.","— Sorry I'm late. — No problem. | — Maaf saya terlambat. — Tidak masalah."],
  ["Excuse me.","/ɪkˈskjuːz miː/","Permisi. / Maaf (menarik perhatian).","Excuse me, where is the toilet? | Permisi, di mana toiletnya?"],
  ["I'm sorry.","/aɪm ˈsɑːri/","Saya minta maaf.","I'm sorry I'm late. | Maaf saya terlambat."],
  ["Sorry to bother you.","/ˈsɑːri tuː ˈbɑːðər juː/","Maaf mengganggu.","Sorry to bother you, but can I ask something? | Maaf mengganggu, boleh saya bertanya?"],
  ["It's okay.","/ɪts oʊˈkeɪ/","Tidak apa-apa.","It's okay, don't worry. | Tidak apa-apa, jangan khawatir."],
  ["Never mind.","/ˈnɛvər maɪnd/","Tidak apa-apa. / Lupakan saja.","Never mind, it's not important. | Sudahlah, itu tidak penting."],
  ["Don't worry.","/doʊnt ˈwɜːri/","Jangan khawatir.","Don't worry, everything will be fine. | Jangan khawatir, semuanya akan baik-baik saja."],
  ["Pardon?","/ˈpɑːrdən/","Maaf, bisa diulang?","Pardon? I didn't hear you. | Maaf? Saya tidak mendengar Anda."],
  ["Could you repeat that?","/kʊd juː rɪˈpiːt ðæt/","Bisa diulangi?","Sorry, could you repeat that, please? | Maaf, bisa tolong diulangi?"],
  ["I don't understand.","/aɪ doʊnt ˌʌndərˈstænd/","Saya tidak mengerti.","I don't understand this word. | Saya tidak mengerti kata ini."],
  ["I see.","/aɪ siː/","Oh begitu. / Saya mengerti.","— It's closed on Monday. — I see. | — Hari Senin tutup. — Oh, begitu."],
  ["Of course!","/əv kɔːrs/","Tentu saja!","— Can I come? — Of course! | — Boleh saya ikut? — Tentu saja!"],
  ["Sure.","/ʃʊr/","Tentu. / Boleh.","— Can you help me? — Sure. | — Bisa bantu saya? — Tentu."],
  ["Maybe.","/ˈmeɪbi/","Mungkin.","Maybe I'll come tomorrow. | Mungkin saya datang besok."],
  ["I agree.","/aɪ əˈɡriː/","Saya setuju.","I agree with you. | Saya setuju denganmu."],
  ["I don't think so.","/aɪ doʊnt θɪŋk soʊ/","Saya rasa tidak.","— Will it rain? — I don't think so. | — Akan hujan? — Saya rasa tidak."],
  ["That's great!","/ðæts ɡreɪt/","Bagus sekali!","You passed? That's great! | Kamu lulus? Bagus sekali!"],
  ["Well done!","/wɛl dʌn/","Kerja bagus!","Well done! You did it. | Kerja bagus! Kamu berhasil."],
  ["What a pity!","/wʌt ə ˈpɪti/","Sayang sekali!","You missed the bus? What a pity! | Kamu ketinggalan bus? Sayang sekali!"],
  ["Good luck!","/ɡʊd lʌk/","Semoga berhasil!","Good luck with your exam! | Semoga sukses ujiannya!"],
  ["Congratulations!","/kənˌɡrætʃəˈleɪʃənz/","Selamat! (atas keberhasilan)","Congratulations on your graduation! | Selamat atas kelulusanmu!"],
  ["Happy birthday!","/ˈhæpi ˈbɜːrθdeɪ/","Selamat ulang tahun!","Happy birthday! Here's a gift for you. | Selamat ulang tahun! Ini hadiah untukmu."],
  ["Get well soon.","/ɡɛt wɛl suːn/","Semoga lekas sembuh.","I heard you're sick. Get well soon. | Saya dengar kamu sakit. Semoga lekas sembuh."],
  ["Bless you!","/blɛs juː/","Semoga sehat! (saat orang bersin)","— Achoo! — Bless you! | — Hatsyi! — Semoga sehat!"],
  ["Cheer up!","/tʃɪr ʌp/","Semangat! / Jangan sedih!","Cheer up! It's not the end of the world. | Semangat! Ini bukan akhir dunia."],
  ["Never give up!","/ˈnɛvər ɡɪv ʌp/","Jangan pernah menyerah!","Keep trying and never give up! | Terus mencoba dan jangan pernah menyerah!"],
  ["Let's go!","/lɛts ɡoʊ/","Ayo pergi!","Let's go! We're late. | Ayo pergi! Kita terlambat."],
  ["Hurry up!","/ˈhɜːri ʌp/","Cepatlah!","Hurry up! The bus is coming. | Cepat! Busnya datang."],
  ["Take your time.","/teɪk jʊr taɪm/","Santai saja, tidak usah buru-buru.","Take your time. There's no rush. | Santai saja. Tidak perlu buru-buru."],
  ["Wait a minute.","/weɪt ə ˈmɪnɪt/","Tunggu sebentar.","Wait a minute, I'm almost ready. | Tunggu sebentar, saya hampir siap."],
  ["Just a moment.","/dʒʌst ə ˈmoʊmənt/","Sebentar.","Just a moment, please. | Mohon tunggu sebentar."],
  ["Be careful!","/biː ˈkɛrfəl/","Hati-hati!","Be careful! The floor is wet. | Hati-hati! Lantainya basah."],
  ["Can you help me?","/kæn juː hɛlp miː/","Bisakah kamu membantu saya?","Excuse me, can you help me? | Permisi, bisa bantu saya?"],
  ["How much is it?","/haʊ mʌtʃ ɪz ɪt/","Berapa harganya?","How much is this shirt? | Berapa harga kemeja ini?"],
  ["What time is it?","/wʌt taɪm ɪz ɪt/","Jam berapa sekarang?","Excuse me, what time is it? | Permisi, jam berapa sekarang?"],
  ["I'm on my way.","/aɪm ɑːn maɪ weɪ/","Saya sedang di jalan.","I'm on my way. See you in ten minutes. | Saya sedang di jalan. Sampai ketemu sepuluh menit lagi."],
  ["Help yourself.","/hɛlp jʊrˈsɛlf/","Silakan ambil sendiri.","There's food on the table. Help yourself. | Ada makanan di meja. Silakan ambil sendiri."],
  ["After you.","/ˈæftər juː/","Silakan duluan.","— After you. — Thank you. | — Silakan duluan. — Terima kasih."],
  ["Enjoy your meal!","/ɪnˈdʒɔɪ jʊr miːl/","Selamat makan!","Here's your food. Enjoy your meal! | Ini makanan Anda. Selamat makan!"],
  ["Keep the change.","/kiːp ðə tʃeɪndʒ/","Ambil saja kembaliannya.","Here's 50,000. Keep the change. | Ini 50.000. Ambil saja kembaliannya."],
  ["Have a nice day!","/hæv ə naɪs deɪ/","Semoga harimu menyenangkan!","Thank you, have a nice day! | Terima kasih, semoga harimu menyenangkan!"],
  ["Have a safe trip!","/hæv ə seɪf trɪp/","Hati-hati di jalan!","Goodbye, have a safe trip! | Sampai jumpa, hati-hati di jalan!"],
  ["Take care.","/teɪk kɛr/","Hati-hati. / Jaga diri.","Take care on your way home. | Hati-hati di jalan pulang."],
  ["I miss you.","/aɪ mɪs juː/","Aku rindu kamu.","I miss you. Come home soon. | Aku rindu kamu. Cepat pulang."],
  ["See you later!","/siː juː ˈleɪtər/","Sampai jumpa nanti!","Bye, see you later! | Dah, sampai jumpa nanti!"],
  ["See you tomorrow!","/siː juː təˈmɑːroʊ/","Sampai jumpa besok!","Good night. See you tomorrow! | Selamat malam. Sampai jumpa besok!"],
  ["Goodbye!","/ɡʊdˈbaɪ/","Selamat tinggal! / Sampai jumpa!","Goodbye and thank you! | Sampai jumpa dan terima kasih!"]
]},

{ no: 71, id: "mc-speech", g: "ekspresi", name: "Naskah MC dan Pidato", en: "Text MC and Speech", icon: "🎙️", items: [
  ["Master of Ceremonies (MC)","/ˈmæstər əv ˈsɛrəmoʊniz/","Pembawa acara","Tonight's Master of Ceremonies is Rina. | Pembawa acara malam ini adalah Rina."],
  ["speaker","/ˈspiːkər/","pembicara","The speaker talked about saving money. | Pembicara membahas cara menabung."],
  ["keynote speaker","/ˈkiːnoʊt ˈspiːkər/","pembicara utama","The keynote speaker is a famous economist. | Pembicara utama adalah ekonom terkenal."],
  ["moderator","/ˈmɑːdəreɪtər/","moderator","The moderator opened the discussion. | Moderator membuka diskusi."],
  ["audience","/ˈɔːdiəns/","hadirin, penonton","The audience clapped loudly. | Hadirin bertepuk tangan meriah."],
  ["rundown","/ˈrʌndaʊn/","susunan acara","Please check the rundown before the event. | Tolong periksa susunan acara sebelum acara dimulai."],
  ["Good morning, everyone.","/ɡʊd ˈmɔːrnɪŋ ˈɛvriwʌn/","Selamat pagi semuanya.","Good morning, everyone. Let's begin. | Selamat pagi semuanya. Mari kita mulai."],
  ["Ladies and gentlemen","/ˈleɪdiz ənd ˈdʒɛntəlmən/","Bapak-bapak dan Ibu-ibu sekalian","Good morning, ladies and gentlemen. | Selamat pagi, Bapak-bapak dan Ibu-ibu sekalian."],
  ["Honorable …","/ˈɑːnərəbəl/","Yang terhormat …","The honorable Principal, Mr. Budi. | Yang terhormat Kepala Sekolah, Bapak Budi.","Honorable"],
  ["Distinguished guests","/dɪˈstɪŋɡwɪʃt ɡɛsts/","Para tamu yang terhormat","Distinguished guests, welcome to our event. | Para tamu yang terhormat, selamat datang di acara kami."],
  ["Respected teachers","/rɪˈspɛktɪd ˈtiːtʃərz/","Bapak/Ibu guru yang saya hormati","Respected teachers and my dear friends. | Bapak/Ibu guru yang saya hormati dan teman-teman yang saya cintai."],
  ["My dear friends","/maɪ dɪr frɛndz/","Teman-teman yang saya cintai","My dear friends, thank you for coming. | Teman-teman yang saya cintai, terima kasih sudah datang."],
  ["Welcome to …","/ˈwɛlkəm tuː/","Selamat datang di …","Welcome to our annual meeting. | Selamat datang di rapat tahunan kami.","Welcome to"],
  ["First of all, let us thank God","","Pertama-tama, marilah kita panjatkan puji syukur kepada Tuhan","First of all, let us thank God Almighty for His blessings. | Pertama-tama, marilah kita panjatkan puji syukur kepada Tuhan Yang Maha Esa atas berkat-Nya."],
  ["We are gathered here today","/wiː ɑːr ˈɡæðərd hɪr təˈdeɪ/","Kita berkumpul di sini hari ini","We are gathered here today to celebrate our school's anniversary. | Kita berkumpul di sini hari ini untuk merayakan ulang tahun sekolah kita."],
  ["On this happy occasion","/ɑːn ðɪs ˈhæpi əˈkeɪʒən/","Pada kesempatan yang berbahagia ini","On this happy occasion, I'd like to say a few words. | Pada kesempatan yang berbahagia ini, izinkan saya menyampaikan beberapa patah kata."],
  ["It is an honor to stand here","","Merupakan suatu kehormatan bagi saya berdiri di sini","It is an honor to stand here in front of you. | Merupakan suatu kehormatan bagi saya berdiri di hadapan Anda sekalian."],
  ["Before we begin","/bɪˈfɔːr wiː bɪˈɡɪn/","Sebelum kita mulai","Before we begin, please turn off your phones. | Sebelum kita mulai, mohon matikan ponsel Anda."],
  ["I hereby open this event","/aɪ ˌhɪrˈbaɪ ˈoʊpən ðɪs ɪˈvɛnt/","Dengan ini saya membuka acara ini","With the blessing of God, I hereby open this event. | Dengan rahmat Tuhan, dengan ini saya membuka acara ini."],
  ["The first agenda is …","/ðə fɜːrst əˈdʒɛndə ɪz/","Acara pertama adalah …","The first agenda is the opening speech. | Acara pertama adalah kata sambutan pembuka.","The first agenda is"],
  ["Opening speech","/ˈoʊpənɪŋ spiːtʃ/","Kata sambutan pembuka","Now, the opening speech by the chairman. | Selanjutnya, kata sambutan pembuka oleh ketua panitia."],
  ["To shorten the time","/tuː ˈʃɔːrtən ðə taɪm/","Untuk mempersingkat waktu","To shorten the time, let's go to the next agenda. | Untuk mempersingkat waktu, mari kita lanjutkan ke acara berikutnya."],
  ["Let's move on to the next agenda","","Mari kita lanjutkan ke acara berikutnya","Let's move on to the next agenda: the speech. | Mari kita lanjutkan ke acara berikutnya: sambutan."],
  ["Allow me to introduce","/əˈlaʊ miː tuː ˌɪntrəˈduːs/","Izinkan saya memperkenalkan","Allow me to introduce our keynote speaker. | Izinkan saya memperkenalkan pembicara utama kita."],
  ["Please welcome","/pliːz ˈwɛlkəm/","Kepada … kami persilakan","Please welcome the headmaster, Mr. Budi. | Kepada Bapak Kepala Sekolah, Bapak Budi, kami persilakan."],
  ["The time is yours","/ðə taɪm ɪz jʊrz/","Waktu dan tempat kami persilakan","Mr. Hadi, the time is yours. | Bapak Hadi, waktu dan tempat kami persilakan."],
  ["On behalf of …","/ɑːn bɪˈhæf əv/","Atas nama …","On behalf of the committee, I thank you. | Atas nama panitia, saya mengucapkan terima kasih.","On behalf of"],

  ["Let's give a big round of applause","","Mari kita beri tepuk tangan yang meriah","Let's give a big round of applause for our winners! | Mari kita beri tepuk tangan yang meriah untuk para pemenang!"],

  ["Break time","/breɪk taɪm/","Waktu istirahat (ishoma)","We will have a 30-minute break time. | Kita akan istirahat selama 30 menit."],
  ["Let us pray together","/lɛt ʌs preɪ təˈɡɛðər/","Marilah kita berdoa bersama","Before we close, let us pray together. | Sebelum kita tutup, marilah kita berdoa bersama."],
  ["In conclusion","/ɪn kənˈkluːʒən/","Sebagai kesimpulan","In conclusion, education is the key to success. | Sebagai kesimpulan, pendidikan adalah kunci kesuksesan."],
  ["Last but not least","/læst bʌt nɑːt liːst/","Terakhir namun tak kalah penting","Last but not least, thank you to the committee. | Terakhir namun tak kalah penting, terima kasih kepada panitia."],
  ["Closing remarks","/ˈkloʊzɪŋ rɪˈmɑːrks/","Kata penutup","Now, the closing remarks by the chairman. | Selanjutnya, kata penutup oleh ketua panitia."],
  ["I apologize for any mistakes","","Mohon maaf atas segala kekurangan","I apologize for any mistakes I have made. | Mohon maaf atas segala kesalahan yang saya perbuat."],
  ["That's all from me","/ðæts ɔːl frʌm miː/","Sekian dari saya","That's all from me. Thank you. | Sekian dari saya. Terima kasih."],
  ["Thank you for your attention","/θæŋk juː fɔːr jʊr əˈtɛnʃən/","Terima kasih atas perhatiannya","Thank you for your kind attention. | Terima kasih atas perhatian Anda."],
  ["Thank you for coming","/θæŋk juː fɔːr ˈkʌmɪŋ/","Terima kasih atas kehadirannya","Thank you for coming to our event. | Terima kasih telah hadir di acara kami."],
  ["See you at the next event","/siː juː æt ðə nɛkst ɪˈvɛnt/","Sampai jumpa di acara berikutnya","Have a safe trip home. See you at the next event! | Hati-hati di jalan. Sampai jumpa di acara berikutnya!"]

{ no: 84, id: "essay-phrases", g: "ujian", name: "Frasa Esai & Opini (IELTS Writing Task 2)", en: "Essay & Opinion Phrases", icon: "✍️", noSpell: true, items: [
  ["It is widely believed that…","","Banyak orang percaya bahwa…","It is widely believed that money brings happiness. | Banyak orang percaya bahwa uang membawa kebahagiaan."],
  ["In my opinion,","/ɪn maɪ əˈpɪnjən/","Menurut saya,","In my opinion, education should be free. | Menurut saya, pendidikan seharusnya gratis."],
  ["From my perspective,","","Dari sudut pandang saya,","From my perspective, both sides have a point. | Dari sudut pandang saya, kedua pihak ada benarnya."],
  ["I strongly agree that…","","Saya sangat setuju bahwa…","I strongly agree that children should learn a second language. | Saya sangat setuju bahwa anak-anak harus belajar bahasa kedua."],
  ["I partly agree with this view.","","Saya setuju sebagian dengan pandangan ini.","I partly agree with this view, for two reasons. | Saya setuju sebagian dengan pandangan ini, karena dua alasan."],
  ["There are two sides to this argument.","","Ada dua sisi dari argumen ini.","There are two sides to this argument, and both will be discussed. | Ada dua sisi dari argumen ini, dan keduanya akan dibahas."],
  ["This essay will discuss…","","Esai ini akan membahas…","This essay will discuss the causes and solutions. | Esai ini akan membahas penyebab dan solusinya."],
  ["One of the main reasons is that…","","Salah satu alasan utamanya adalah…","One of the main reasons is that cities offer more jobs. | Salah satu alasan utamanya adalah kota menawarkan lebih banyak pekerjaan."],
  ["A key advantage of … is that…","","Keuntungan utama dari … adalah…","A key advantage of online learning is that it is flexible. | Keuntungan utama belajar online adalah fleksibel."],
  ["The main drawback is that…","","Kelemahan utamanya adalah…","The main drawback is that it is expensive. | Kelemahan utamanya adalah biayanya mahal."],
  ["A good example of this is…","","Contoh yang baik dari hal ini adalah…","A good example of this is Singapore. | Contoh yang baik dari hal ini adalah Singapura."],
  ["This can be seen in…","","Hal ini dapat dilihat pada…","This can be seen in many developing countries. | Hal ini dapat dilihat di banyak negara berkembang."],
  ["This leads to…","","Hal ini menyebabkan…","This leads to higher unemployment. | Hal ini menyebabkan pengangguran meningkat."],
  ["It could be argued that…","","Dapat dikatakan bahwa…","It could be argued that technology isolates people. | Dapat dikatakan bahwa teknologi mengasingkan orang."],
  ["Opponents argue that…","","Pihak yang menentang berpendapat bahwa…","Opponents argue that the policy is unfair. | Pihak yang menentang berpendapat kebijakan itu tidak adil."],
  ["Supporters claim that…","","Pendukungnya mengklaim bahwa…","Supporters claim that it creates jobs. | Pendukungnya mengklaim hal itu menciptakan lapangan kerja."],
  ["It is undeniable that…","","Tidak dapat dipungkiri bahwa…","It is undeniable that the internet has changed education. | Tidak dapat dipungkiri bahwa internet telah mengubah pendidikan."],
  ["There is no doubt that…","","Tidak diragukan lagi bahwa…","There is no doubt that exercise is good for health. | Tidak diragukan lagi bahwa olahraga baik untuk kesehatan."],
  ["Governments should…","","Pemerintah seharusnya…","Governments should invest more in public transport. | Pemerintah seharusnya berinvestasi lebih banyak pada transportasi umum."],
  ["Measures should be taken to…","","Langkah-langkah harus diambil untuk…","Measures should be taken to reduce pollution. | Langkah-langkah harus diambil untuk mengurangi polusi."],
  ["In the long run,","/ɪn ðə lɔːŋ rʌn/","Dalam jangka panjang,","In the long run, this will save money. | Dalam jangka panjang, ini akan menghemat uang."],
  ["In the short term,","/ɪn ðə ʃɔːrt tɜːrm/","Dalam jangka pendek,","In the short term, prices may rise. | Dalam jangka pendek, harga mungkin naik."],
  ["To a certain extent,","/tuː ə ˈsɜːrtən ɪkˈstɛnt/","Sampai batas tertentu,","To a certain extent, I agree with this idea. | Sampai batas tertentu, saya setuju dengan gagasan ini."],
  ["The benefits outweigh the drawbacks.","","Manfaatnya lebih besar daripada kerugiannya.","Overall, the benefits outweigh the drawbacks. | Secara keseluruhan, manfaatnya lebih besar daripada kerugiannya."],
  ["This is particularly true for…","","Hal ini terutama berlaku bagi…","This is particularly true for young people. | Hal ini terutama berlaku bagi anak muda."],
  ["With the rapid development of…","","Dengan pesatnya perkembangan…","With the rapid development of technology, jobs are changing. | Dengan pesatnya perkembangan teknologi, pekerjaan pun berubah."],
  ["Nowadays, more and more people…","","Saat ini, semakin banyak orang…","Nowadays, more and more people work from home. | Saat ini, semakin banyak orang bekerja dari rumah."],
  ["Some people believe that…, while others…","","Sebagian orang percaya bahwa…, sementara yang lain…","Some people believe that zoos are cruel, while others think they protect animals. | Sebagian orang percaya kebun binatang itu kejam, sementara yang lain menganggapnya melindungi hewan."],
  ["In conclusion, I believe that…","","Sebagai kesimpulan, saya yakin bahwa…","In conclusion, I believe that the government should act now. | Sebagai kesimpulan, saya yakin pemerintah harus bertindak sekarang."]
]},

{ no: 85, id: "speaking-phrases", g: "ujian", name: "Frasa Speaking (IELTS & TOEFL)", en: "Speaking Phrases", icon: "💭", noSpell: true, items: [
  ["That's an interesting question.","","Itu pertanyaan yang menarik (untuk mengulur waktu berpikir).","That's an interesting question. Let me think. | Itu pertanyaan yang menarik. Biar saya pikir dulu."],
  ["Let me think about that for a moment.","","Biar saya pikirkan sebentar.","Let me think about that for a moment… I'd say yes. | Biar saya pikirkan sebentar… saya rasa ya."],
  ["Well, to be honest,","/wɛl tuː biː ˈɑːnɪst/","Yah, sejujurnya,","Well, to be honest, I don't watch much TV. | Yah, sejujurnya, saya jarang menonton TV."],
  ["As far as I know,","/æz fɑːr æz aɪ noʊ/","Sejauh yang saya tahu,","As far as I know, the museum is free. | Sejauh yang saya tahu, museum itu gratis."],
  ["I'd say that…","/aɪd seɪ ðæt/","Menurut saya…","I'd say that my hometown is quite peaceful. | Menurut saya kampung halaman saya cukup tenang."],
  ["Personally, I prefer…","","Secara pribadi, saya lebih suka…","Personally, I prefer reading to watching films. | Secara pribadi, saya lebih suka membaca daripada menonton film."],
  ["I'm not really sure, but…","","Saya tidak begitu yakin, tapi…","I'm not really sure, but I think it's about ten years old. | Saya tidak begitu yakin, tapi rasanya sekitar sepuluh tahun."],
  ["It depends on…","/ɪt dɪˈpɛndz ɑːn/","Tergantung pada…","It depends on the weather. | Tergantung cuacanya."],
  ["What I mean is…","/wʌt aɪ miːn ɪz/","Maksud saya adalah…","What I mean is that cities are too crowded. | Maksud saya, kota-kota terlalu padat."],
  ["Could you repeat the question, please?","","Bisakah Anda mengulang pertanyaannya?","Sorry, could you repeat the question, please? | Maaf, bisakah Anda mengulang pertanyaannya?"],
  ["Do you mean…?","/duː juː miːn/","Apakah maksud Anda…?","Do you mean my job or my studies? | Maksud Anda pekerjaan saya atau kuliah saya?"],
  ["I've never really thought about it, but…","","Saya belum pernah benar-benar memikirkannya, tapi…","I've never really thought about it, but I guess I'd choose the beach. | Saya belum pernah benar-benar memikirkannya, tapi mungkin saya pilih pantai."],
  ["The main reason is that…","","Alasan utamanya adalah…","The main reason is that it's close to my office. | Alasan utamanya karena dekat dengan kantor saya."],
  ["Compared to…,","/kəmˈpɛrd tuː/","Dibandingkan dengan…,","Compared to Jakarta, Semarang is less crowded. | Dibandingkan Jakarta, Semarang tidak terlalu padat."],
  ["Back in the day,","/bæk ɪn ðə deɪ/","Dulu,","Back in the day, people wrote letters. | Dulu, orang-orang menulis surat."],
  ["These days,","/ðiːz deɪz/","Akhir-akhir ini, zaman sekarang,","These days, everyone shops online. | Zaman sekarang, semua orang belanja online."],
  ["I'm really into…","/aɪm ˈrɪəli ˈɪntuː/","Saya sangat suka…","I'm really into photography. | Saya sangat suka fotografi."],
  ["I'm keen on…","/aɪm kiːn ɑːn/","Saya gemar…","I'm keen on hiking at weekends. | Saya gemar mendaki di akhir pekan."],
  ["I can't stand…","/aɪ kænt stænd/","Saya tidak tahan dengan…","I can't stand traffic jams. | Saya tidak tahan dengan kemacetan."],
  ["It's not my cup of tea.","","Itu bukan selera saya.","Horror films are not my cup of tea. | Film horor bukan selera saya."],
  ["On top of that,","/ɑːn tɑːp əv ðæt/","Lebih dari itu, ditambah lagi,","On top of that, the food is cheap. | Ditambah lagi, makanannya murah."],
  ["Anyway,","/ˈɛniweɪ/","Bagaimanapun, ngomong-ngomong,","Anyway, that's why I love my city. | Bagaimanapun, itulah alasan saya mencintai kota saya."],
  ["To cut a long story short,","","Singkat cerita,","To cut a long story short, we missed the train. | Singkat cerita, kami ketinggalan kereta."],
  ["That's about it.","/ðæts əˈbaʊt ɪt/","Kira-kira begitu (menutup jawaban).","So that's about it. | Jadi kira-kira begitu."],
  ["I'd like to talk about…","","Saya ingin bercerita tentang… (pembuka cue card)","I'd like to talk about a teacher who inspired me. | Saya ingin bercerita tentang guru yang menginspirasi saya."],
  ["The reason why I chose this is…","","Alasan saya memilih ini adalah…","The reason why I chose this is that it changed my life. | Alasan saya memilih ini karena hal itu mengubah hidup saya."],
  ["It reminds me of…","/ɪt rɪˈmaɪndz miː əv/","Itu mengingatkan saya pada…","This song reminds me of my childhood. | Lagu ini mengingatkan saya pada masa kecil."],
  ["If I had the chance, I would…","","Jika saya punya kesempatan, saya akan…","If I had the chance, I would study in Australia. | Jika saya punya kesempatan, saya akan kuliah di Australia."],
  ["Generally speaking,","/ˈdʒɛnərəli ˈspiːkɪŋ/","Secara umum,","Generally speaking, Indonesians are friendly. | Secara umum, orang Indonesia ramah."],
  ["I suppose…","/aɪ səˈpoʊz/","Saya kira…","I suppose it's because of the weather. | Saya kira itu karena cuacanya."]

{ no: 86, id: "synonyms", g: "ujian", name: "Sinonim untuk Parafrase", en: "Synonyms for Paraphrasing", icon: "🔄", items: [
  ["crucial","/ˈkruːʃəl/","sangat penting · = very important","Water is crucial for farming. | Air sangat penting bagi pertanian."],
  ["pivotal","/ˈpɪvətəl/","sangat menentukan · = very important","Teachers play a pivotal role. | Guru memegang peran yang sangat menentukan."],
  ["numerous","/ˈnuːmərəs/","banyak sekali · = many","There are numerous benefits. | Ada banyak sekali manfaatnya."],

  ["scarce","/skɛrs/","langka · = rare, not enough","Clean water is scarce in some areas. | Air bersih langka di beberapa daerah."],

  ["prevalent","/ˈprɛvələnt/","umum, banyak terjadi · = common","Obesity is prevalent in rich countries. | Obesitas umum terjadi di negara kaya."],
  ["contemporary","/kənˈtɛmpərɛri/","kontemporer, modern · = modern","Contemporary art can be strange. | Seni kontemporer bisa terlihat aneh."],
  ["obsolete","/ˌɑːbsəˈliːt/","usang · = out of date","Fax machines are now obsolete. | Mesin faks kini sudah usang."],
  ["rudimentary","/ˌruːdɪˈmɛntəri/","dasar, sederhana · = basic","He has only rudimentary English. | Bahasa Inggrisnya masih sangat dasar."],
  ["affluent","/ˈæfluənt/","makmur, kaya · = rich","Affluent families can afford private schools. | Keluarga kaya mampu membayar sekolah swasta."],
  ["impoverished","/ɪmˈpɑːvərɪʃt/","miskin · = poor","Many impoverished villages lack electricity. | Banyak desa miskin tidak memiliki listrik."],
  ["detrimental","/ˌdɛtrɪˈmɛntəl/","merugikan · = harmful","Smoking is detrimental to health. | Merokok merugikan kesehatan."],

    if (!known[key]) { known[key] = Date.now(); srs[key] = { l: 1, d: addDays(Date.now(), 1) }; }
    favs.delete(key); requestPersist();
  } else { delete known[key]; delete srs[key]; }
  saveKnown(); saveFavs(); saveSrs(); syncLearnedToday();
}
function setFav(key, on) {
  if (on) { favs.add(key); delete known[key]; delete srs[key]; } else favs.delete(key);
  saveFavs(); saveKnown(); saveSrs(); syncLearnedToday();
}
function toggleKnown(key) {
  const on = !known[key]; const wasFav = favs.has(key);

const TTS = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let voices = [];
let warnedVoice = false;
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const ttsLang = () => settings.accent === 'UK' ? 'en-GB' : 'en-US';
function pickVoice(lang) {
  const L = lang.toLowerCase();
  const same = voices.filter(v => (v.lang || '').replace('_', '-').toLowerCase() === L);
  if (same.length) return same.find(v => /google|natural|enhanced|premium|siri/i.test(v.name)) || same[0];
  return null;
}
function speak(text, btn, rate) {
  if (!TTS) { toast('Browser ini belum mendukung audio (Text-to-Speech).'); return; }
  if (!text) return;
  try { speechSynthesis.cancel(); } catch (e) {}
  const lang = ttsLang();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = rate || settings.rate; u.pitch = 1;
  if (!voices.length) loadVoices();
  const v = pickVoice(lang);
  if (v) u.voice = v;
  else {
    const anyEn = voices.find(x => /^en/i.test(x.lang || ''));
    if (anyEn) u.voice = anyEn;
    if (voices.length && !warnedVoice) { warnedVoice = true; toast(`Suara aksen ${settings.accent} tidak tersedia di HP ini, memakai suara Inggris lain.`); }
  }
  $$('.playing').forEach(b => b.classList.remove('playing'));
  if (btn) btn.classList.add('playing');
  const done = () => btn && btn.classList.remove('playing');
  u.onend = done; u.onerror = done;
  setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { done(); } }, 60);
  setTimeout(done, 8000);
}
let recog = null;
function stopRecog() { if (recog) { try { recog.abort(); } catch (e) {} recog = null; } }
function listenOnce(lang, onResult, onDone) {
  if (!SR) { toast('Pengenalan suara belum didukung di browser ini. Coba Chrome di Android.'); return false; }
  stopRecog();
  try { if (TTS) speechSynthesis.cancel(); } catch (e) {}
  const r = new SR(); recog = r;
  r.lang = lang; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  let finished = false;
  const finish = err => { if (finished) return; finished = true; if (recog === r) recog = null; onDone && onDone(err); };
  r.onresult = e => { const res = e.results[0]; const alts = []; for (let i = 0; i < res.length; i++) alts.push(res[i].transcript); onResult(alts); };
  r.onerror = e => finish(e.error || 'error');
  r.onend = () => finish(null);
  try { r.start(); } catch (e) { finish('start'); return false; }
  return true;
}

function progInner(spec) {
  const [type, id] = spec.split(':');
  if (type === 'total') {
    const k = countKnown(WORDS), t = WORDS.length;
    const mastered = WORDS.filter(w => { const s = srsOf(w.key); return s && s.l >= MASTER_LVL; }).length;
    const doneCats = CATEGORIES.filter(c => c.words.length && countKnown(c.words) === c.words.length).length;
    return `<div class="prog-top"><b>🎯 Total Hafalan</b><span class="prog-pct">${pctLabel(k, t)}</span></div>
      <div class="prog-num">${fmtNum(k)} <small>/ ${fmtNum(t)} kata</small></div>
      ${pbar(k, t)}
      <div class="prog-mini"><span>🏆 ${fmtNum(mastered)} dikuasai</span><span>⭐ ${favs.size} favorit</span><span>🏁 ${doneCats}/${CATEGORIES.length} kategori tuntas</span>
      <a href="#/statistik">📊 Statistik</a><a href="#/pengaturan">💾 ${meta.lastBackup ? 'Backup ' + ago(meta.lastBackup) : 'Belum pernah backup'}</a></div>`;
  }
  if (type === 'today') {
    const r = stats.days[dayKey()]; const done = dayTotal(r); const goal = settings.goal; const met = !!(r && r.met);
    const st = streakNow();
    const yMet = (() => { const d = new Date(); d.setDate(d.getDate() - 1); const y = stats.days[dayKey(d.getTime())]; return !!(y && y.met); })();
    const streakTxt = st > 0 ? `🔥 ${st} hari beruntun` : '🔥 Mulai streak hari ini';
    return `<div class="ring-sm${met ? ' met' : ''}" style="--p:${Math.min(100, pctOf(done, goal))}"><div><b>${met ? '✓' : done}</b><small>${met ? 'tuntas' : '/ ' + goal}</small></div></div>
      <div class="today-info"><b>Target hari ini</b>
        <span>${met ? 'Tercapai! Hebat 🎉' : `${goal - done} kata lagi · kata baru hafal + kata diulang`}</span>
        <span class="streak-chip">${streakTxt}${!met && yMet ? ' · jangan putus!' : ''}</span></div>`;
  }
  if (type === 'review') {
    const due = dueWords().length; const tomorrow = dueBetween(1, 2);
    return `<span class="ri">🔁</span><span class="rt"><b>Ulangan Hari Ini</b><span>${due ? `${due} kata perlu diulang agar tidak lupa` : `Tidak ada ulangan sekarang${tomorrow ? ` · besok ${tomorrow} kata` : ''}`}</span></span><span class="go">${ic('chevR')}</span>`;
  }
  if (type === 'cat') {

    const n = c.words.length, k = countKnown(c.words), due = dueWords(c.words).length;
    return `<div class="prog-top"><b>Progres kategori</b><span class="prog-pct">${pctLabel(k, n)}</span></div>
      <div class="prog-num">${k} <small>/ ${n} kata hafal</small></div>${pbar(k, n)}
      ${due ? `<button class="btn soft block" style="margin-top:12px;height:44px" data-act="start-review" data-src="${esc(c.id)}">🔁 Ulang ${due} kata yang jatuh tempo</button>` : ''}
      ${n && k === n ? '<div class="prog-mini" style="margin-top:8px"><span>🎉 Semua kata di kategori ini sudah hafal!</span></div>' : ''}`;
  }
  if (type === 'seg') {
    const c = CAT_BY_ID.get(id); if (!c) return '';
    const n = c.words.length, k = countKnown(c.words);
    return [['all', 'Semua', n], ['unknown', 'Belum Hafal', n - k], ['known', 'Sudah Hafal', k]]
      .map(([v, l, cnt]) => `<button data-act="cat-status" data-v="${v}" class="${settings.catStatus === v ? 'on' : ''}">${l}<small>${cnt}</small></button>`).join('');
  }
  if (type === 'continue') {
    const c = lastCat && CAT_BY_ID.get(lastCat.id);
    if (!c) {
      const first = CATEGORIES[0];
      return `<a class="continue" href="#/k/${esc(first.id)}"><span class="ci">${first.icon}</span><span class="ct"><small>Mulai belajar</small><b>${esc(first.name)}</b><span>Mulai dari kategori pertama</span></span><span class="go">${ic('chevR')}</span></a>`;
    }

function searchWords(q) {
  const n = norm(q).trim();
  if (!n) return [];
  const re = new RegExp('(^|[^a-z0-9])' + reEsc(n));
  const out = [];
  for (const w of WORDS) {
    let s = 0;
    if (w.nEn === n || w.nAr === n) s = 100;
    else if (w.nEn.startsWith(n)) s = 85;
    else if (w.nAr.startsWith(n)) s = 80;
    else if (re.test(w.nEn)) s = 65;
    else if (re.test(w.nAr)) s = 60;
    else if (w.nEn.includes(n)) s = 45;
    else if (w.nAr.includes(n)) s = 40;
    if (s) out.push([s, w]);
  }
  out.sort((a, b) => b[0] - a[0] || a[1].en.length - b[1].en.length);
  return out.map(x => x[1]);

   SESI LATIHAN
   ===================================================================== */
function groupWords(gid) { return CATEGORIES.filter(c => c.g === gid).reduce((a, c) => a.concat(c.words), []); }
function getPool(src) {
  if (String(src).startsWith('grp:')) {
    const g = GROUP_BY_ID.get(src.slice(4));
    return g ? { pool: groupWords(g.id), label: g.name } : { pool: [], label: '' };
  }
  if (src === 'fav') return { pool: WORDS.filter(w => favs.has(w.key)), label: 'Favorit' };
  if (src === 'hard') return { pool: hardWords(), label: 'Kata sulit' };
  if (src === 'all') return { pool: WORDS.slice(), label: 'Semua kategori' };
  const c = CAT_BY_ID.get(src);
  return c ? { pool: c.words.slice(), label: c.name } : { pool: [], label: '' };
}
function makeQuestion(w, pool, dir) {
  const field = dir === 'en-id' ? 'ar' : 'en';
  const answer = w[field];
  const seen = new Set([norm(answer)]);
  const opts = [answer];
  const cands = shuffle(w.cat.words).concat(shuffle(pool), shuffle(WORDS));
  for (const c of cands) {
    if (opts.length >= 4) break;
    const v = c[field]; const nv = norm(v);
    if (!v || seen.has(nv)) continue;
    seen.add(nv); opts.push(v);
  }
  return { w, prompt: dir === 'en-id' ? w.en : w.ar, answer, options: shuffle(opts) };
}
function goSession() {
  if (location.hash === '#/latihan/sesi') { route(); window.scrollTo(0, 0); }
  else location.hash = '#/latihan/sesi';
}
function startPractice(mode, src, status) {
  mode = mode || settings.pMode; src = src || settings.pSrc; status = status || settings.pStatus;
  if (!['all', 'unknown', 'known'].includes(status)) status = 'all';
  if (mode === 'speak' && !SR) { toast('Mode Pengucapan butuh browser yang mendukung pengenalan suara (Chrome Android).'); return; }
  settings.pMode = mode; settings.pSrc = src; saveSettings();
  let { pool, label } = getPool(src);
  if (!pool.length) { toast(src === 'fav' ? 'Favorit masih kosong. Tandai kata dengan ⭐ dulu.' : src === 'hard' ? 'Belum ada kata sulit. Bagus!' : 'Belum ada kata di sumber ini.'); return; }
  pool = byStatus(pool, status);

}

function judgeSpeech(w, alts) {

  const minLen = Math.min.apply(null, targets.map(t => t.length));

}

    $('#heard').innerHTML = `<div class="heard ${r.ok ? 'good' : 'bad'}">${r.ok ? '✅ Bagus! ' : '❌ Belum pas. '}Terdengar: <b>“${esc(r.heard)}”</b>${r.ok ? '' : '<br>Dengarkan contoh, lalu coba lagi.'}</div>`;

}
