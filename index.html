/* =====================================================================
   HALAMAN: PENGATURAN, BACKUP & RESTORE
   ===================================================================== */
function backupData() {
  return {
    app: 'KosaKata', type: 'progress-backup', version: 2,
    exportedAt: new Date().toISOString(),
    totalWords: WORDS.length,
    known, favs: Array.from(favs), srs, stats, lastCat,
    settings: { theme: settings.theme, accent: settings.accent, rate: settings.rate, fontScale: settings.fontScale, goal: settings.goal, voiceLang: settings.voiceLang }
  };
}
function backupFile() {
  const text = JSON.stringify(backupData());
  const name = `kosakata-backup-${dateStamp()}`;
  const candidates = [
    new File([text], name + '.json', { type: 'application/json' }),
    new File([text], name + '.txt', { type: 'text/plain' })
  ];
  return { text, name: name + '.json', candidates };
}
function shareableFile() {
  if (!navigator.canShare) return null;
  try { return backupFile().candidates.find(f => navigator.canShare({ files: [f] })) || null; } catch (e) { return null; }
}
function markBackup() { meta.lastBackup = Date.now(); saveMeta(); const el = $('#last-backup'); if (el) el.textContent = fmtDate(meta.lastBackup); updateProgress(); }
function exportFile() {
  const { text, name } = backupFile();
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markBackup();
  toast('⬇️ File backup diunduh: ' + name);
}
async function exportShare() {
  const f = shareableFile();
  if (!f) { exportFile(); return; }
  try {
    await navigator.share({ files: [f], title: 'Backup KosaKata', text: 'Backup progres hafalan KosaKata' });
    markBackup(); toast('✓ File backup dibagikan');
  } catch (e) { if (e && e.name !== 'AbortError') toast('Gagal membagikan. Coba “Export ke file”.'); }
}
async function exportCopy() {
  const text = JSON.stringify(backupData());
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  if (ok) { markBackup(); toast('📋 Kode backup disalin. Tempel di catatan/chat untuk disimpan.'); }
  else toast('Gagal menyalin. Gunakan “Export ke file”.');
}
function parseBackup(text) {
  let d;
  try { d = JSON.parse(String(text || '').trim()); } catch (e) { throw new Error('Isi file/kode tidak valid. Pastikan kode disalin utuh.'); }
  if (!d || typeof d !== 'object' || (d.app !== 'KosaKata' && !d.known && !d.favs)) throw new Error('Ini bukan file backup KosaKata.');
  const kn = sanitizeKnown(d.known || {});
  const fv = Array.isArray(d.favs) ? d.favs.filter(k => typeof k === 'string' && WORD_BY_KEY.has(k)) : [];
  const lc = d.lastCat && typeof d.lastCat.id === 'string' && CAT_BY_ID.has(d.lastCat.id) ? d.lastCat : null;
  return { known: kn, favs: fv, srs: sanitizeSrs(d.srs || {}), stats: sanitizeStats(d.stats || {}), lastCat: lc, settings: d.settings || null, exportedAt: d.exportedAt || null };
}

const scrollMem = {};
let currentHash = location.hash || '#/';
function parseHash() {
  const h = (location.hash || '').replace(/^#/, '') || '/';
  const qi = h.indexOf('?');
  const path = qi >= 0 ? h.slice(0, qi) : h;
  const qs = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : '');
  return { parts: path.split('/').filter(Boolean), qs };
}
function route() {
  const { parts, qs } = parseHash();
  try { if (TTS) speechSynthesis.cancel(); } catch (e) {}
  stopRecog();
  if (parts[0] === 'kategori') { currentTab = 'cats'; renderCats(qs.get('g') || 'all'); }
  else if (parts[0] === 'k') {
    const c = CAT_BY_ID.get(parts[1]);
    if (!c) { location.replace('#/kategori'); return; }
    if (qs.get('lanjut') && lastCat && lastCat.id === c.id && lastCat.status) settings.catStatus = lastCat.status;
    currentTab = 'cats'; renderCat(c);
  }
  else if (parts[0] === 'favorit') { currentTab = 'fav'; renderFav(qs.get('tab')); }
  else if (parts[0] === 'latihan') {
    currentTab = 'practice';
    if (parts[1] === 'sesi') { if (!session) { location.replace('#/latihan'); return; } renderSession(); }
    else renderPracticeSetup();
  }
  else if (parts[0] === 'statistik') { currentTab = 'stats'; renderStats(); }
  else if (parts[0] === 'pengaturan') { currentTab = 'settings'; renderSettings(); }
  else { currentTab = 'home'; renderHome(); }
  $$('.nav-item').forEach(a => {
    const on = a.dataset.tab === currentTab;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  updateFavBadge();
}
function scrollTarget(hash) {
  if (/^#\/k\/[^?]+\?lanjut=1/.test(hash) && lastCat) return lastCat.scroll || 0;
  if (/^#\/(kategori(\?.*)?|favorit(\?.*)?)?$/.test(hash) || hash === '#') return scrollMem[hash] || 0;
  return 0;
}
window.addEventListener('hashchange', () => {
  scrollMem[currentHash] = window.scrollY;
  currentHash = location.hash || '#/';
  internalNav = true;
  route();
  window.scrollTo(0, scrollTarget(currentHash));
});
let scrollSaveTimer;
window.addEventListener('scroll', () => {
  if (currentView !== 'cat' || !currentCat || !lastCat || lastCat.id !== currentCat.id) return;
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(() => {
    if (currentView !== 'cat' || !lastCat || lastCat.id !== currentCat.id) return;

  }, 400);
}, { passive: true });

document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const w = el.dataset.key ? WORD_BY_KEY.get(el.dataset.key) : null;
  const s = session;
  switch (act) {
    case 'speak': if (w) speak(sayText(w), el); break;
    case 'speak-ex': if (w) speak(w.ex, el); break;
    case 'fav': if (w) toggleFav(w.key); break;
    case 'known': if (w) toggleKnown(w.key); break;
    case 'expand': el.closest('.word').classList.toggle('open'); break;
    case 'toggle-all': {
      const cards = $$('.word.has-ex'); const open = !cards.every(c => c.classList.contains('open'));
      cards.forEach(c => c.classList.toggle('open', open)); el.textContent = open ? 'Tutup semua' : 'Buka semua'; break;
    }
    case 'cat-status':
      settings.catStatus = el.dataset.v; saveSettings();
      if (lastCat && currentCat && lastCat.id === currentCat.id) { lastCat.status = settings.catStatus; saveLast(); }
      updateProgress(); drawCatWords(); break;
    case 'cat-more': { const m = $('#cat-more'); m.hidden = !m.hidden; el.textContent = m.hidden ? '➕ Lainnya' : '➖ Tutup'; break; }
    case 'back': if (internalNav && history.length > 1) history.back(); else location.hash = el.dataset.href || '#/'; break;
    case 'theme': settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); applyTheme(); { const d = $('#set-dark'); if (d) d.checked = settings.theme === 'dark'; } break;
    case 'accent':
      settings.accent = settings.accent === 'US' ? 'UK' : 'US'; saveSettings(); applyAccent(); warnedVoice = false;
      toast(settings.accent === 'UK' ? '🇬🇧 Aksen British dipilih' : '🇺🇸 Aksen Amerika dipilih');
      if (currentView === 'settings') renderSettings();
      break;
    case 'set-accent': settings.accent = el.dataset.v; saveSettings(); applyAccent(); warnedVoice = false; renderSettings(); speak('Hello, how are you?'); break;
    case 'set-rate': settings.rate = Number(el.dataset.v); saveSettings(); renderSettings(); speak('This is the reading speed.'); break;
    case 'set-font': settings.fontScale = Number(el.dataset.v); saveSettings(); applyFont(); renderSettings(); break;
    case 'set-vlang': settings.voiceLang = el.dataset.v; saveSettings(); renderSettings(); break;
    case 'set-goal':
      settings.goal = Number(el.dataset.v); saveSettings(); checkGoal(); saveStats();
      toast(`🎯 Target harian: ${settings.goal} kata`);
      if (currentView === 'stats') { const y = window.scrollY; renderStats(); window.scrollTo(0, y); } else renderSettings();
      break;
    case 'clear-search': searchQuery = ''; { const q = $('#q'); q.value = ''; q.focus(); } $('#q-clear').hidden = true; renderResults(); break;
    case 'voice-search': startVoiceSearch(); break;
    case 'voice-lang':
      settings.voiceLang = settings.voiceLang === 'id' ? 'en' : 'id'; saveSettings();
      stopRecog(); setTimeout(startVoiceSearch, 150); break;
    case 'clear-favs':
      if (confirm('Hapus semua kata dari Favorit?')) { favs.clear(); saveFavs(); renderFav('fav'); updateFavBadge(); toast('Favorit dikosongkan'); }
      break;
    case 'clear-hard':
      if (confirm('Kosongkan daftar Kata Sulit?')) { stats.words = {}; saveStats(); renderFav('sulit'); toast('Daftar kata sulit dikosongkan'); }
      break;
    case 'pset': {
      const k = el.dataset.k; settings[k] = k === 'pN' ? Number(el.dataset.v) : el.dataset.v; saveSettings(); renderPracticeSetup(); break;
    }
    case 'start': {
      const st = el.dataset.status === 'cat' ? settings.catStatus : el.dataset.status;
      startPractice(el.dataset.mode, el.dataset.src, st); break;
    }

    case 'fc-judge': {
      const cw = s.cards[s.i];
      if (el.dataset.v === '1') { s.known++; if (!known[cw.key]) setKnown(cw.key, true); toast('✓ Ditandai sudah hafal'); }
      else { s.unknown++; setFav(cw.key, true); toast('★ Ditandai belum hafal'); }
      updateFavBadge(); flashMove(1); break;
    }
    case 'rv': {

    case 'play-q': playQ(el.dataset.slow === '1'); break;

    case 'spell-check': checkSpell(false); break;
    case 'spell-skip': checkSpell(true); break;
    case 'spell-listen': { const q = s.qs[s.i]; speak(sayText(q.w), el); break; }

function makeIcon(size) {

  grd.addColorStop(0, '#14B8A6'); grd.addColorStop(1, '#0F766E');
  x.fillStyle = grd; x.fillRect(0, 0, size, size);
  x.fillStyle = '#FFFFFF';
  x.font = `800 ${Math.round(size * 0.36)}px "Plus Jakarta Sans", system-ui, sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('Aa', size * 0.5, size * 0.53);
  x.fillStyle = '#F59E0B';
  x.beginPath(); x.arc(size * 0.7, size * 0.33, size * 0.055, 0, Math.PI * 2); x.fill();
  return c.toDataURL('image/png');
}

      add('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })));
    }
    add('apple-touch-icon', makeIcon(180));
    add('icon', i192, { type: 'image/png' });
  } catch (e) { /* abaikan */ }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e;
  const s = $('#install-slot'); if (s) s.innerHTML = installCard();
});
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('✓ KosaKata terpasang di layar utama'); });
